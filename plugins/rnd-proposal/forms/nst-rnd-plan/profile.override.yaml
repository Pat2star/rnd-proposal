# 사람이 확인·정정한 값. 확인일 2026-08-13.
# 양식: (양식) 출연연 전략연구사업 연구개발계획서_초안.hwpx
#
# 자동 추론이 heading_1/heading_2/bullet_level_0/1/table_header/table_cell을
# 전부 high 신뢰도로 잡았다. 아래는 사례가 없어 추정에 그친 4건만 확정한다.

roles:
  # 1수준 글머리 — 최빈 charPr 55가 #0000FF 안내문이라 검정 54로 치환됨
  bullet_level_0:
    para: '39'
    char: '54'
    style: '4'
    confidence: high
    evidence: >
      추론기의 최빈값 charPr 55는 파란 양식 안내문이다. 같은 11pt 검정인
      charPr 54로 치환한 결과를 승인한다. body와 같은 글자모양이라
      평문단과 글머리 항목의 크기가 맞는다.

  # 2수준 글머리 — 최빈 charPr 59가 #0000FF 안내문이라 검정 11로 치환됨
  bullet_level_1:
    para: '49'
    char: '11'
    style: '4'
    confidence: high
    evidence: >
      추론기의 최빈값 charPr 59는 파란 양식 안내문이다. 같은 10pt 검정인
      charPr 11로 치환한 결과를 승인한다. 1수준(11pt)보다 한 급 작아
      수준 위계가 글자 크기로도 드러난다.

  # 표 앵커 — 관측된 4종 중 무엇을 쓸 것인가
  table_anchor:
    para: '0'
    char: '9'
    style: '0'
    confidence: high
    evidence: >
      관측된 4종은 paraPr 22(CENTER 130%), 0(JUSTIFY), 0, 14(LEFT)다.
      paraPr 22는 가운데정렬이라 표가 가운데로 몰리고, 14는 제목용(heading_1)이라
      개요 흐름을 깨뜨린다. 들여쓰기 0에 JUSTIFY인 paraPr 0을 쓴다.

  # 3수준 제목 — 사례 없음
  heading_3:
    para: '39'
    char: '55'
    style: '4'
    confidence: high
    evidence: >
      본문 목차 체계는 `1.` → `1)` 두 수준뿐이고 3수준 제목 사례가 없다.
      추론기가 제안한 paraPr 14 / charPr 63(13pt bold)은 대제목과 같은
      문단모양이라 1수준과 구분이 안 된다. 이 양식의 실제 관행대로
      `###` 는 1수준 글머리(paraPr 39, 들여쓰기 1500)로 렌더한다.

  # 3수준 글머리 — 사례 없음
  bullet_level_2:
    para: '19'
    char: '59'
    style: '4'
    confidence: high
    evidence: >
      BULLET 문단모양 사다리는 39(1500) → 49(2500) → 19(3500)이다.
      추론기는 사례가 없어 39를 재사용하자고 했으나 그러면 1수준과 겹친다.
      들여쓰기가 한 칸 더 깊은 paraPr 19를 3수준으로 쓴다.

  # 그림 캡션 — 사례 없음
  figure_caption:
    para: '22'
    char: '9'
    style: '0'
    confidence: high
    evidence: >
      이 양식에는 그림이 없어 캡션 사례도 없다. 추론기가 제안한 바탕글
      (paraPr 0, JUSTIFY)은 캡션답지 않다. paraPr 22가 CENTER 130%로
      캡션 관행에 맞으므로 그걸 쓴다. 글자는 본문급 charPr 53.

  # 평문단 — 이 양식은 본문이 전부 글머리라 사례가 사실상 없다
  body:
    para: '0'
    char: '54'
    style: '0'
    confidence: high
    evidence: >
      추론기는 paraPr 16 / charPr 8(10pt)을 잡았는데 그건 "※국가과학기술연구회…"
      같은 각주성 안내문이라 본문 서식이 아니다. paraPr 0(JUSTIFY 160%,
      들여쓰기 0, 본문 5회)에 글머리 1수준과 같은 크기인 11pt 검정 charPr 54를
      얹는다. 그래야 평문단과 글머리 항목의 글자 크기가 맞는다.

  bold:
    para: null
    char: '10'
    confidence: high
    policy: strip
    evidence: >
      본문 높이와 같은 bold charPr이 있으나 조립기 v1이 인라인 bold run을
      아직 구현하지 않았다(mdblocks.strip_inline이 항상 제거). strip 유지.

writing_rules:
  max_bullet_depth: 3
  inline_bold: false
  inline_cross_ref: false

