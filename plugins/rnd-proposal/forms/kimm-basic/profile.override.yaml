# 사람이 확인·정정한 값. 확인일 2026-08-13.
#
# 이 양식은 제목·표·캡션 사례가 하나도 없는 단순 문서라, 추출기가 표준 스타일
# 이름(engName)으로 후보만 제안했다(전부 confidence: low). 아래는 그 제안을
# 이 양식의 실제 서식 구조에 맞춰 사람이 확정한 것이다.
#
# 관측된 사실:
#   paraPr 0     JUSTIFY 160% 들여쓰기 0  (본문 10회 — 사실상 모든 문단)
#   paraPr 2~8   OUTLINE 사다리 (들여쓰기 1000/2000/3000/4000/5000/6000/7000)
#   paraPr 10    JUSTIFY 130%  (캡션급 줄간격)
#   charPr 32,30 10pt 함초롬돋움 bold / charPr 31 10pt 정체
#   borderFill   1, 2 두 개뿐 (둘 다 0.1mm 무채움) → 표는 단순 실선으로 나온다

roles:
  # ── 제목: 이 양식엔 크기 위계가 없다. 굵기로만 구분한다 ──
  heading_1:
    para: '0'
    char: '32'
    style: '0'
    confidence: high
    evidence: >
      제목 사례가 없다. 이 양식은 글자 크기 위계가 없고(본문·제목 모두 10pt)
      bold charPr 30/32만 있다. OUTLINE 사다리(paraPr 2~8)를 제목에 쓰면
      들여쓰기가 붙어 대제목이 안쪽으로 밀리므로, 들여쓰기 0인 paraPr 0에
      bold charPr 32를 얹는다.
  heading_2:
    para: '0'
    char: '30'
    style: '0'
    confidence: high
    evidence: 대제목과 같은 문단모양에 다른 bold 글자모양(30)으로 구분한다.
  heading_3:
    para: '0'
    char: '31'
    style: '0'
    confidence: high
    evidence: 3수준은 굵기를 빼 정체(charPr 31)로 구분한다.

  # ── 글머리: OUTLINE 사다리를 그대로 쓴다 ──
  # ★ OUTLINE 문단모양(paraPr 2~8)은 한글이 개요 번호(1. 가. 1)…)를 자동으로
  #   붙인다. 실제로 렌더해 보니 본문 앞에 '1.' '3.' '가.'가 생겼다.
  #   들여쓰기만 다른 NONE 문단모양을 쓴다.
  bullet_level_0:
    para: '14'
    char: '31'
    style: '0'
    confidence: high
    evidence: >
      OUTLINE 사다리(paraPr 2~8)를 쓰면 개요 번호가 자동으로 붙어 본문이
      '1. 산업 공정열…'처럼 나온다(실측). heading=NONE이면서 들여쓰기가 있는
      paraPr 14(1100)를 1수준으로 쓴다.
  bullet_level_1:
    para: '15'
    char: '31'
    style: '0'
    confidence: high
    evidence: heading=NONE, 들여쓰기 2200. 2수준.
  bullet_level_2:
    para: '1'
    char: '31'
    style: '0'
    confidence: high
    evidence: heading=NONE, 들여쓰기 1500. 3수준 (이 양식엔 더 깊은 칸이 없다).

  # ★ 그림/표 앵커도 OUTLINE이면 개요번호('1)')가 붙는다. NONE 문단모양을 쓴다.
  figure_anchor:
    para: '0'
    char: '31'
    style: '0'
    confidence: high
    evidence: >
      추출기가 잡은 paraPr 4는 heading=OUTLINE이라 그림 옆에 개요번호 '1)'이
      붙는다(실측). 들여쓰기 0이고 heading=NONE인 paraPr 0을 쓴다.
      그러면 그림이 본문폭을 그대로 쓸 수 있다.
  table_anchor:
    para: '0'
    char: '31'
    style: '0'
    confidence: high
    evidence: figure_anchor와 동일. 들여쓰기 0, heading=NONE.

  body:
    para: '0'
    char: '31'
    style: '0'
    confidence: high
    evidence: 본문 최다 문단모양(10회). 10pt 함초롬돋움 정체.

  # ── 표: 사례가 없어 사람이 결정 ──
  table_header:
    para: '0'
    char: '32'
    style: '0'
    confidence: high
    evidence: >
      표 사례가 없다. 머리행은 bold(charPr 32)로 본문셀과 구분한다.
      borderFill이 1,2 두 개(0.1mm 무채움)뿐이라 회색 음영은 나오지 않는다 —
      조립기가 기본 셀로 폴백하고 경고를 남긴다.
  table_cell:
    para: '0'
    char: '31'
    style: '0'
    confidence: high
    evidence: 표 본문셀은 정체(charPr 31).

  figure_caption:
    para: '10'
    char: '31'
    style: '0'
    confidence: high
    evidence: >
      캡션 사례가 없다. paraPr 10이 줄간격 130%로 캡션급이다.
      이 양식에는 CENTER 정렬 문단모양이 없어 가운데정렬은 못 한다.

  bold:
    para: null
    char: '32'
    confidence: high
    policy: strip
    evidence: >
      이 양식에는 본문 높이(10pt)와 같은 bold charPr 30/32가 있어 원리상
      **굵게**를 살릴 수 있다. 다만 **조립기 v1이 인라인 bold run을 아직
      구현하지 않았다** (mdblocks.strip_inline이 마크업을 항상 제거한다).
      구현 전까지는 strip으로 둔다. v2에서 run 분할을 넣으면 char 32를 쓰면 된다.

writing_rules:
  max_bullet_depth: 3
  inline_bold: false
